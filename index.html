<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Clock">
<meta name="robots" content="noindex">
<title>HCT Time Clock</title>
<!--
  HCT Time Clock — photo kiosk for the base iPad.
  Lives outside Google (GitHub Pages) because Google's web-app frame blocks the camera; it talks to the
  "HCT Timeclock" Apps Script (doPost in Code.gs). The access key comes from the link (?k=...) and is
  remembered on the iPad — it is never stored in this file. Source of truth: hct-crew-app/timeclock/kiosk-page.
  Photos: a live camera snapshot where the browser allows it. Where it doesn't (the base iPad runs iOS 12, which gives
  Home Screen web apps no camera), tapping Clock In/Out opens the iPad camera for a selfie instead.
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #eef1ec; color: #1b1f1a; font-family: -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
  header { position: fixed; top: 0; left: 0; right: 0; background: #263a22; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  header b { font-size: 20px; } #net { font-size: 14px; opacity: .85; padding: 6px 0 6px 12px; }
  #clock { font-size: 64px; font-weight: 700; letter-spacing: -1px; } #date { font-size: 20px; color: #4b5548; margin-top: -10px; }
  .dots { display: flex; gap: 14px; height: 26px; } .dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #263a22; }
  .dots i.on { background: #263a22; }
  .pad { display: grid; grid-template-columns: repeat(3, 96px); gap: 14px; }
  .pad button { height: 82px; border: 0; border-radius: 18px; background: #fff; font-size: 34px; font-weight: 600; color: #1b1f1a; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .pad button:active { background: #dfe6da; } .pad .ghost { background: transparent; box-shadow: none; font-size: 18px; color: #555; }
  .msg { min-height: 28px; font-size: 20px; text-align: center; } .err { color: #b00020; }
  .card { background: #fff; border-radius: 22px; padding: 28px 34px; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.12); min-width: 380px; max-width: 92vw; }
  .card h1 { margin: 0 0 6px; font-size: 34px; } .card p { margin: 0 0 18px; font-size: 18px; color: #4b5548; }
  .big { display: block; width: 100%; border: 0; border-radius: 16px; padding: 24px; font-size: 30px; font-weight: 700; color: #fff; }
  .in { background: #2e7d32; } .out { background: #c62828; } .cancel { margin-top: 14px; background: #e6e9e2; color: #333; font-size: 20px; padding: 16px; }
  .done h1 { font-size: 40px; } .done .tick { font-size: 70px; }
  .done { position: relative; } .done .hrs { font-size: 34px; font-weight: 700; margin: 6px 0 10px; color: #1b1f1a; }
  .x { position: absolute; top: 10px; right: 14px; width: 56px; height: 56px; border: 0; border-radius: 28px; background: #e0e5dc; font-size: 30px; line-height: 56px; padding: 0; }
  /* no preview: the video has to stay "on screen" for iPads to keep feeding it frames, so it is 1px and see-through */
  #cam { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
  .hide { display: none !important; }
  .setup { max-width: 520px; text-align: center; font-size: 18px; line-height: 1.5; }
</style>
</head>
<body>
<header><b>HCT Time Clock</b><span id="net"></span></header>
<div class="wrap hide" id="nokey"><div class="setup"><h2>This clock isn't set up</h2>Open the full kiosk link (it ends with <code>?k=…</code>) on this iPad once. Ask the office for it.</div></div>
<div class="wrap" id="home">
  <div id="clock"></div><div id="date"></div>
  <div class="msg" id="msg">Enter your PIN</div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
</div>
<div class="wrap hide" id="confirm"><div class="card">
  <h1 id="cName"></h1><p id="cInfo"></p>
  <button class="big" id="cGo"></button><button class="big cancel hide" id="cNoPic"></button><button class="big cancel" id="cNo">Cancel</button>
</div></div>
<div class="wrap hide" id="done"><div class="card done"><button type="button" class="x hide" id="dX" aria-label="Close">✕</button><div class="tick">✓</div><h1 id="dTitle"></h1><p class="hrs hide" id="dHrs"></p><p id="dInfo"></p></div></div>
<video id="cam" autoplay playsinline muted></video>
<canvas id="snap" width="320" height="240" class="hide"></canvas>
<input type="file" id="pick" accept="image/*" capture="user" class="hide">
<script>
// The "Kiosk (base iPad)" web-app deployment of the HCT Timeclock script. Not secret: every call also needs the key.
var API = 'https://script.google.com/macros/s/AKfycbyJj01ZmNGFfockPUTZylujRcD8dXKgxYinUtarqbOJ6SIM1h8NHTR63ijHg07jilge/exec';
var KKEY = 'hctClockKey', QKEY = 'hctClockQueue', MAXLEN = 4;   // PINs are 4 digits: the 4th digit sends it, no OK needed
var pin = '', who = null, busy = false, resetT = null;
function $(id) { return document.getElementById(id); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

// ---- access key: from the link the first time, then remembered on this iPad ----
var K = new URLSearchParams(location.search).get('k') || store(KKEY) || '';
if (K) store(KKEY, K);
if (!K) { $('home').classList.add('hide'); $('nokey').classList.remove('hide'); }

function show(id) { ['home', 'confirm', 'done'].forEach(function (x) { $(x).classList.toggle('hide', x !== id); }); }

// ---- talking to the timeclock script ----
function api(action, body) {
  body.k = K; body.action = action;
  var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 30000);
  return fetch(API, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal })   // text/plain: no preflight
    .then(function (r) { return r.json(); }, function (e) { var x = new Error(e.name === 'AbortError' ? 'timeout' : 'network'); x.offline = e.name !== 'AbortError'; throw x; })
    .then(function (r) { clearTimeout(t); if (!r.ok) throw new Error(r.error); return r.data; },
          function (e) { clearTimeout(t); throw e; });
}

// ---- clock + keypad ----
function tick() {
  var d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
setInterval(tick, 1000); tick();
var keys = ['1','2','3','4','5','6','7','8','9','Clear','0','Back'];
$('pad').innerHTML = keys.map(function (k) { return '<button type="button" class="' + (k.length > 1 ? 'ghost' : '') + '" data-k="' + k + '">' + (k === 'Back' ? '⌫' : k) + '</button>'; }).join('');
$('pad').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-k]'); if (!b || busy) return;
  var k = b.getAttribute('data-k');
  if (k === 'Clear') pin = ''; else if (k === 'Back') pin = pin.slice(0, -1); else if (pin.length < MAXLEN) pin += k;
  drawDots(); setMsg('Enter your PIN');
  if (pin.length === MAXLEN) lookup();
});
function drawDots() { var h = ''; for (var i = 0; i < Math.max(4, pin.length); i++) h += '<i class="' + (i < pin.length ? 'on' : '') + '"></i>'; $('dots').innerHTML = h; }
function clean(err) { return String(err && err.message || err || '').replace(/^(Exception|Error):\s*/, ''); }
function setMsg(t, err) { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }
drawDots();

// ---- camera: kept running so the picture is instant; punches still work if it's off ----
var cam = $('cam'), stream = null, camWhy = '';
function startCam() {
  if (stream && stream.active) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camWhy = 'not available here'; drawNet(); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
    .then(function (s) { stream = s; camWhy = ''; cam.srcObject = s; s.getTracks().forEach(function (t) { t.onended = function () { stream = null; }; }); drawNet(); })
    .catch(function (e) { stream = null; camWhy = { NotAllowedError: 'blocked', NotFoundError: 'no camera', NotReadableError: 'in use by another app' }[e && e.name] || (e && e.name) || 'error'; drawNet(); });
}
function photo() {
  if (!stream || cam.readyState < 2 || !cam.videoWidth) return '';
  try {
    var c = $('snap'), w = cam.videoWidth, h = cam.videoHeight, s = Math.min(w / 320, h / 240);
    c.getContext('2d').drawImage(cam, (w - 320 * s) / 2, (h - 240 * s) / 2, 320 * s, 240 * s, 0, 0, 320, 240);
    return c.toDataURL('image/jpeg', 0.7);
  } catch (e) { return ''; }
}
function camTo() { if (cam.paused) cam.play().catch(function () {}); }
document.addEventListener('visibilitychange', function () { if (!document.hidden) startCam(); });
$('net').addEventListener('click', function () { if (!stream) startCam(); });   // a tap lets the iPad ask for the camera again
if (K) startCam();

// In Safari (not the Home Screen icon), go full screen on a tap so the address bar is hidden — where the iPad allows it.
function fullScreen() {
  if (navigator.standalone) return;
  var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
  if (!req || document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement) return;
  try { var r = req.call(el); if (r && r.catch) r.catch(function () {}); } catch (e) {}
}
document.addEventListener('click', fullScreen, true);
document.addEventListener('touchend', fullScreen, true);

// ---- punching ----
function lookup() {
  if (pin.length < MAXLEN) return;
  busy = true; setMsg('Checking…'); startCam();
  api('who', { pin: pin }).then(function (w) {
    busy = false; who = w;
    $('cName').textContent = 'Hi ' + w.name.split(' ')[0];
    $('cInfo').textContent = w.next === 'OUT' ? 'You clocked in ' + w.since + '.' : 'You are clocked out.';
    $('cGo').textContent = w.next === 'OUT' ? 'Clock Out' : 'Clock In';
    $('cGo').className = 'big ' + (w.next === 'OUT' ? 'out' : 'in');
    $('cNoPic').classList.add('hide'); camTo();
    show('confirm'); later(20000);
  }, function (err) {
    busy = false;
    if (err.offline || !navigator.onLine) { queue(photo()); return; }
    pin = ''; drawDots(); setMsg(err.message === 'timeout' ? 'No answer from the server. Try again.' : clean(err) || 'Try again', true);
  });
}
$('cGo').onclick = function () {
  if (busy || !who) return;
  if (stream) { send(photo()); return; }
  // no live camera: open the iPad camera for a selfie (must happen inside this tap)
  later(90000); $('pick').value = ''; $('pick').click();
  $('cNoPic').textContent = (who.next === 'OUT' ? 'Clock Out' : 'Clock In') + ' without photo';
  $('cNoPic').classList.remove('hide'); $('cGo').textContent = 'Take photo again';
};
$('pick').onchange = function () {
  var f = this.files && this.files[0]; if (!f || busy) return;
  busy = true; $('cGo').textContent = 'Saving…';
  shrink(f, function (pic) { busy = false; send(pic); });
};
$('cNoPic').onclick = function () { if (!busy && who) send(''); };
function send(pic) {
  if (busy) return;
  busy = true; clearTimeout(resetT); $('cGo').textContent = 'Saving…';
  var type = who.next, p = pin;
  api('punch', { pin: p, type: type, photo: '' }).then(function (r) {   // photo goes after, so nobody waits on Drive
    busy = false; finish((r.type === 'OUT' ? 'Clocked Out' : 'Clocked In') + ' ' + r.time, 'Thanks, ' + r.name.split(' ')[0] + '!');
    if (r.worked != null) {   // clock-out: show the shift's hours until they tap ✕ (or 30 s)
      $('dHrs').textContent = 'You worked ' + Math.floor(r.worked / 60) + ' h ' + (r.worked % 60) + ' min';
      $('dInfo').textContent = 'Since ' + r.since + '. Thanks, ' + r.name.split(' ')[0] + '!';
      $('dHrs').classList.remove('hide'); $('dX').classList.remove('hide'); later(30000);
    }
    if (pic && r.id) sendPhoto({ id: r.id, pin: p, photo: pic });
  }, function (err) {
    busy = false;
    if (err.offline || !navigator.onLine) { queue(pic); return; }
    finish('Not saved', err.message === 'timeout' ? 'No answer from the server. Check the On the clock list before trying again.' : clean(err) || 'Please try again.', true);
  });
}
/** Camera photo → small 320×240 JPEG, upright (iOS 12 doesn't rotate photos drawn on a canvas, so we do). */
function shrink(file, done) {
  var rd = new FileReader();
  rd.onload = function () {
    // newer browsers already draw photos upright; only old ones (iOS 12) need the EXIF turn applied by hand
    var auto = window.CSS && CSS.supports && CSS.supports('image-orientation', 'from-image');
    var turn = auto ? 1 : jpegTurn(rd.result), url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var side = turn >= 5, w = side ? img.height : img.width, h = side ? img.width : img.height;
      var c = $('snap'), x = c.getContext('2d'), s = Math.min(w / 320, h / 240);
      x.save(); x.clearRect(0, 0, 320, 240);
      x.translate(160, 120); x.scale(1 / s, 1 / s);   // centre crop to 4:3
      if (turn === 3) x.rotate(Math.PI); else if (turn === 6) x.rotate(Math.PI / 2); else if (turn === 8) x.rotate(-Math.PI / 2);
      x.drawImage(img, -img.width / 2, -img.height / 2);
      x.restore(); URL.revokeObjectURL(url);
      try { done(c.toDataURL('image/jpeg', 0.7)); } catch (e) { done(''); }
    };
    img.onerror = function () { done(''); };
    img.src = url;
  };
  rd.onerror = function () { done(''); };
  rd.readAsArrayBuffer(file.slice(0, 65536));
}
function jpegTurn(buf) {   // EXIF orientation (1 = upright), 0 if unknown
  try {
    var v = new DataView(buf), o = 2;
    if (v.getUint16(0) !== 0xFFD8) return 0;
    while (o < v.byteLength - 4) {
      var m = v.getUint16(o), len = v.getUint16(o + 2);
      if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
        var t = o + 10, le = v.getUint16(t) === 0x4949, n = v.getUint16(t + v.getUint32(t + 4, le), le);
        for (var i = 0; i < n; i++) {
          var e = t + v.getUint32(t + 4, le) + 2 + i * 12;
          if (v.getUint16(e, le) === 0x0112) return v.getUint16(e + 8, le);
        }
        return 0;
      }
      o += 2 + len;
    }
  } catch (x) {}
  return 0;
}
$('cNo').onclick = reset;
$('dX').onclick = reset;
function finish(title, info, bad) {
  camTo();
  $('dTitle').textContent = title; $('dInfo').textContent = info;
  $('dHrs').classList.add('hide'); $('dX').classList.add('hide');
  document.querySelector('.tick').textContent = bad ? '!' : '✓';
  document.querySelector('.tick').style.color = bad ? '#b00020' : '#2e7d32';
  show('done'); later(bad ? 6000 : 4000);
}
function later(ms) { clearTimeout(resetT); resetT = setTimeout(reset, ms); }
function reset() { clearTimeout(resetT); camTo(); pin = ''; who = null; busy = false; drawDots(); setMsg('Enter your PIN'); show('home'); }

// ---- offline: keep the punch on the iPad, send it when the connection is back ----
function readQ() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
function writeQ(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }
function queue(pic) {
  var q = readQ(); q.push({ id: 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), pin: pin, at: Date.now(), photo: pic || '' }); writeQ(q); drawNet();
  finish('Saved ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), 'No internet right now, so your PIN can\'t be checked. Your punch is saved on this iPad and will be sent automatically. If you think you mistyped your PIN, tell the office.');
}
function drawNet() {
  var n = readQ().length;
  $('net').textContent = [n ? n + ' punch' + (n > 1 ? 'es' : '') + ' waiting to send' : '', K && !stream && camWhy !== 'not available here' ? 'Camera off' + (camWhy ? ' (' + camWhy + ')' : '') + ' — tap to turn on' : ''].filter(Boolean).join(' · ');
}
// photos for punches already saved; one that fails waits here and is sent again with the next flush
var PKEY = 'hctClockPhotos';
function readP() { try { return JSON.parse(localStorage.getItem(PKEY) || '[]'); } catch (e) { return []; } }
function writeP(q) { try { localStorage.setItem(PKEY, JSON.stringify(q.slice(-20))); } catch (e) {} }
function sendPhoto(x) {
  return api('photo', x).then(function () {}, function (err) {
    if (err.offline || err.message === 'timeout') { var q = readP().filter(function (y) { return y.id !== x.id; }); q.push(x); writeP(q); }
  });
}
var sending = false;
function flush() {
  var q = readQ(), ph = readP(); if ((!q.length && !ph.length) || !navigator.onLine || sending) return;
  sending = true;
  (q.length ? api('sync', { list: q }).then(function () { writeQ(readQ().slice(q.length)); }, function () {}) : Promise.resolve())
    .then(function () {
      if (!ph.length) return;
      writeP(readP().filter(function (y) { return !ph.some(function (z) { return z.id === y.id; }); }));
      return ph.reduce(function (pr, x) { return pr.then(function () { return sendPhoto(x); }); }, Promise.resolve());
    })
    .then(function () { sending = false; drawNet(); });
}
if (K) { setInterval(flush, 60000); window.addEventListener('online', flush); setTimeout(flush, 3000); }
drawNet();
</script>
</body>
</html>
